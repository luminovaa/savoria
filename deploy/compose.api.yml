services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: savoria-api:latest
    restart: unless-stopped
    env_file:
      - ../backend/.env
    ports:
      - "8080:8080"
    networks:
      - postgres

  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: savoria-api:latest
    restart: "no"
    env_file:
      - ../backend/.env
    entrypoint: ["/savoria-migrate"]
    working_dir: /
    networks:
      - postgres
    profiles:
      - tools

  import-supabase:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: savoria-api:latest
    restart: "no"
    env_file:
      - ../backend/.env
    entrypoint: ["/savoria-import-supabase"]
    command: ["--dry-run"]
    networks:
      - postgres
    profiles:
      - tools

networks:
  postgres:
    external: true
    name: ${POSTGRES_DOCKER_NETWORK:-global-net}
